<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-Cut</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f2a; --muted: #667085; --line: #dfe3ea;
    --accent: #3b5bdb; --warn: #b54708; --warn-bg: #fff4e5; --err: #c0262d; --trial: #c2410c; --sel: #e7ecff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --card: #1a1f2b; --text: #e8ebf2; --muted: #98a2b3; --line: #2b3242;
      --accent: #7c93ff; --warn: #f5b04a; --warn-bg: #3a2f16; --err: #ff7b82; --trial: #fb923c; --sel: #26304f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; cursor: pointer; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fields { display: grid; gap: 12px; }
  .fields[hidden] { display: none; }
  .error { color: var(--err); font-size: 13px; min-height: 1.2em; margin: 0; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .name { font-weight: 600; }
  .badge { font-size: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 0 8px; margin-left: 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .summary { text-align: center; }
  .summary .label { color: var(--muted); font-size: 13px; }
  .summary .total { font-size: 32px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .summary .range { color: var(--muted); font-size: 13px; }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .cal .cell { min-height: 48px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px;
    text-align: center; font-size: 13px; }
  .cal .blank { border: none; }
  .cal .past { opacity: .45; }
  .cal .today { outline: 2px solid var(--accent); outline-offset: -1px; font-weight: 700; }
  .marks { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1px; font-size: 12px; line-height: 1.2; min-height: 1.2em; }
  .marks .pay { color: var(--accent); }
  .marks .trial { color: var(--trial); }
  .marks .more { color: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend .pay { color: var(--accent); }
  .legend .trial { color: var(--trial); }

  .agenda li { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: baseline; }
  .agenda .date { font-weight: 600; font-variant-numeric: tabular-nums; }
  .agenda .dday { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .agenda .what { min-width: 0; overflow-wrap: anywhere; }
  .agenda .trial-tag { color: var(--trial); font-weight: 600; }
  .agenda .pay-tag { color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; min-height: 1.2em; margin: 8px 0 0; }
  ul[hidden] { display: none; }
  #list { margin-top: 12px; }
  .cal .num { display: block; }
  button.cell { font: inherit; font-weight: normal; color: inherit; background: transparent; width: 100%; cursor: pointer; }
  button.cell:hover { border-color: var(--accent); }
  .cal .cell.selected { background: var(--sel); border-color: var(--accent); }
  .day-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-detail[hidden] { display: none; }
  .day-detail .day-head { font-weight: 600; margin-bottom: 8px; }
  .day-detail ul { gap: 6px; }
  .day-detail .pay-tag { color: var(--accent); }
  .day-detail .trial-tag { color: var(--trial); }
  .day-detail .day-sum { margin-top: 8px; font-size: 13px; font-weight: 600; text-align: right; }
  button.toggle { width: 100%; margin-top: 10px; background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.toggle[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sub-Cut</h1>

  <div class="notice" id="storageNotice" hidden>
    이 브라우저에서는 저장소를 사용할 수 없어요. 입력한 내용은 새로고침하면 사라져요.
  </div>

  <section class="card summary" id="summary" aria-live="polite">
    <div class="label">이번 달 남은 구독료</div>
    <div class="total" id="total"></div>
    <div class="range" id="range"></div>
  </section>

  <section class="card">
    <h2 id="calTitle">이번 달 캘린더</h2>
    <div class="cal" id="cal"></div>
    <div class="legend" aria-hidden="true">
      <span><span class="pay">●</span> 결제일</span>
      <span><span class="trial">◆</span> 체험 만료일</span>
    </div>
    <div class="day-detail" id="dayDetail" role="region" aria-live="polite" hidden></div>
  </section>

  <section class="card">
    <h2>남은 결제 일정</h2>
    <ul class="agenda" id="agenda"></ul>
    <button type="button" class="toggle" id="agendaToggle" aria-controls="agenda" aria-expanded="false" hidden></button>
  </section>

  <section class="card">
    <h2>구독 관리</h2>
    <form id="form" novalidate>
      <label>이름
        <input id="name" required maxlength="50" placeholder="예: Netflix" autocomplete="off">
      </label>
      <label>종류
        <select id="kind">
          <option value="pay">정기 결제</option>
          <option value="trial">무료 체험</option>
        </select>
      </label>

      <div class="fields" id="payFields">
        <label>금액 (원)
          <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="예: 17000">
        </label>
        <label>결제 주기
          <select id="cycle">
            <option value="month">매월</option>
            <option value="year">매년</option>
            <option value="week">매주</option>
          </select>
        </label>
        <label>결제 일자
          <input id="baseDate" type="date">
        </label>
      </div>

      <div class="fields" id="trialFields" hidden>
        <label>체험 만료일
          <input id="expiryDate" type="date" disabled>
        </label>
      </div>

      <p class="error" id="error" role="alert"></p>
      <button type="submit">등록</button>
    </form>
    <p class="status" id="status" role="status"></p>

    <button type="button" class="toggle" id="listToggle" aria-controls="list" aria-expanded="false"></button>
    <ul id="list" hidden></ul>
  </section>
</div>

<script>
const STORAGE_KEY = 'sub-cut:v2';
const CYCLE_LABEL = { month: '매월', year: '매년', week: '매주' };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

const $ = (id) => document.getElementById(id);

// ---------- 저장소 ----------
// 구독 목록은 항상 배열이다. 저장소가 막혀 있거나 비어 있어도 빈 배열로 시작한다.
function isValidSub(s) {
  if (!s || typeof s.id !== 'string' || typeof s.name !== 'string') return false;
  if (s.kind === 'trial') return DATE_RE.test(s.expiryDate);
  if (s.kind === 'pay') {
    return Number.isInteger(s.amount) && s.amount >= 0 &&
      s.cycle in CYCLE_LABEL && DATE_RE.test(s.baseDate);
  }
  return false;
}

function loadSubs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(isValidSub) : [];
  } catch {
    return [];
  }
}

// 저장에 성공하면 true, 실패하면 false
function saveSubs(list) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch {
    return false;
  }
}

function storageAvailable() {
  try {
    const k = STORAGE_KEY + ':probe';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch {
    return false;
  }
}

let subs = loadSubs();

// ---------- 날짜 계산 ----------
// 날짜는 'YYYY-MM-DD' 문자열로 다룬다. 같은 형식이라 문자열 비교가 곧 날짜 비교다.
// 일 수 계산에만 UTC 기준 숫자를 쓰고(시간대 영향 없음), 로컬 시간대로 바꾸지 않는다.
const pad = (n) => String(n).padStart(2, '0');
const fmt = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const DAY_MS = 86400000;

function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return { y, m, d };
}
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function toDayNumber(s) { const { y, m, d } = parseYMD(s); return Date.UTC(y, m - 1, d) / DAY_MS; }
function fromDayNumber(n) {
  const t = new Date(n * DAY_MS);
  return fmt(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
}

// 오늘(기기의 로컬 날짜). 테스트에서 바꿔 끼울 수 있게 함수로 분리했다.
function getToday() {
  const t = new Date();
  return fmt(t.getFullYear(), t.getMonth() + 1, t.getDate());
}

// 오늘(포함)부터 이번 달 말일(포함)까지, 이 구독의 결제일 목록을 돌려준다.
// 체험은 결제하지 않으므로 항상 빈 배열이다. 기준일 이전에는 결제가 없다.
function remainingPaymentDates(sub, today) {
  if (sub.kind !== 'pay') return [];
  const t = parseYMD(today);
  const monthEnd = fmt(t.y, t.m, daysInMonth(t.y, t.m));
  const base = parseYMD(sub.baseDate);

  // 이번 달의 결제일. 기준일의 '일'이 이번 달에 없으면 말일로 당긴다.
  const thisMonthDate = () => fmt(t.y, t.m, Math.min(base.d, daysInMonth(t.y, t.m)));
  const inRange = (ds) => ds >= today && ds <= monthEnd && ds >= sub.baseDate;

  if (sub.cycle === 'month') {
    const ds = thisMonthDate();
    return inRange(ds) ? [ds] : [];
  }
  if (sub.cycle === 'year') {
    if (base.m !== t.m) return [];
    const ds = thisMonthDate();
    return inRange(ds) ? [ds] : [];
  }
  // 매주: 기준일에서 7일씩 더한 날짜 중 구간 안에 드는 날짜
  const baseNum = toDayNumber(sub.baseDate);
  const startNum = Math.max(toDayNumber(today), baseNum);
  const endNum = toDayNumber(monthEnd);
  const dates = [];
  for (let n = baseNum + Math.ceil((startNum - baseNum) / 7) * 7; n <= endNum; n += 7) {
    dates.push(fromDayNumber(n));
  }
  return dates;
}

// 이번 달 남은 구독료 총합과 결제 건수
function remainingTotal(list, today) {
  let total = 0, count = 0;
  for (const s of list) {
    if (s.kind !== 'pay') continue; // 체험은 금액이 없고 합계에도 넣지 않는다
    const n = remainingPaymentDates(s, today).length;
    total += s.amount * n;
    count += n;
  }
  return { total, count };
}

const monthDay = (ds) => { const { m, d } = parseYMD(ds); return `${m}/${d}`; };

const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function weekdayOf(ds) {
  const { y, m, d } = parseYMD(ds);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
const daysUntil = (ds, today) => toDayNumber(ds) - toDayNumber(today);
const ddayText = (diff) => (diff === 0 ? 'D-DAY' : diff > 0 ? `D-${diff}` : `D+${-diff}`);

// 오늘(포함)부터 이번 달 말일까지의 일정(결제일, 체험 만료일)을 날짜순으로 돌려준다.
// 결제일은 총합과 같은 remainingPaymentDates로 구하므로 둘이 어긋나지 않는다.
function monthEvents(list, today) {
  const t = parseYMD(today);
  const monthEnd = fmt(t.y, t.m, daysInMonth(t.y, t.m));
  const events = [];
  for (const s of list) {
    if (s.kind === 'trial') {
      if (s.expiryDate >= today && s.expiryDate <= monthEnd) {
        events.push({ date: s.expiryDate, kind: 'trial', name: s.name });
      }
    } else {
      for (const date of remainingPaymentDates(s, today)) {
        events.push({ date, kind: 'pay', name: s.name, amount: s.amount, cycle: s.cycle });
      }
    }
  }
  // 날짜순. 같은 날에는 체험 만료를 먼저 보여준다. (놓치면 의도치 않은 결제가 생긴다)
  const rank = (e) => (e.kind === 'trial' ? 0 : 1);
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : rank(a) - rank(b)));
  return events;
}

const eventText = (e) => (e.kind === 'trial'
  ? `${e.name} 체험 만료`
  : `${e.name} 결제 ${e.amount.toLocaleString('ko-KR')}원`);

// ---------- 화면 ----------
function renderSummary(today) {
  const t = parseYMD(today);
  const { total, count } = remainingTotal(subs, today);
  $('total').textContent = `${total.toLocaleString('ko-KR')}원`;
  $('range').textContent =
    `${monthDay(today)} ~ ${t.m}/${daysInMonth(t.y, t.m)} · 결제 ${count}건`;
}

const MAX_MARKS = 3; // 한 칸에 마커를 이 개수까지 그리고 나머지는 +N으로 줄인다
let selectedDate = null; // 캘린더에서 눌러 상세를 보고 있는 날짜 ('YYYY-MM-DD')

function renderCalendar(today, events) {
  const t = parseYMD(today);
  $('calTitle').textContent = `이번 달 · ${t.y}년 ${t.m}월`;

  const byDate = {};
  for (const e of events) (byDate[e.date] ||= []).push(e);
  // 선택한 날짜에 일정이 없어졌으면(구독 변경 등) 선택을 푼다.
  if (selectedDate && !byDate[selectedDate]) selectedDate = null;

  const cal = $('cal');
  cal.replaceChildren();
  for (const w of WEEKDAYS) {
    const h = document.createElement('div');
    h.className = 'dow';
    h.textContent = w;
    cal.appendChild(h);
  }

  // 1일이 시작하는 요일만큼 빈 칸을 둔다. (일요일 시작)
  const lead = weekdayOf(fmt(t.y, t.m, 1));
  for (let i = 0; i < lead; i++) {
    const b = document.createElement('div');
    b.className = 'cell blank';
    b.setAttribute('aria-hidden', 'true');
    cal.appendChild(b);
  }

  for (let d = 1; d <= daysInMonth(t.y, t.m); d++) {
    const ds = fmt(t.y, t.m, d);
    const todays = byDate[ds] || [];
    // 일정이 있는 날만 누를 수 있게 button으로 만든다.
    const cell = document.createElement(todays.length > 0 ? 'button' : 'div');
    cell.className = 'cell';
    if (todays.length > 0) cell.type = 'button';
    if (ds < today) cell.classList.add('past');
    if (ds === today) { cell.classList.add('today'); cell.setAttribute('aria-current', 'date'); }

    // button 안에는 div를 넣을 수 없어서 span을 쓴다. (줄바꿈은 CSS의 display로 처리)
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;

    const marks = document.createElement('span');
    marks.className = 'marks';
    marks.setAttribute('aria-hidden', 'true');
    for (const e of todays.slice(0, MAX_MARKS)) {
      const m = document.createElement('span');
      m.className = e.kind;
      m.textContent = e.kind === 'trial' ? '◆' : '●';
      marks.appendChild(m);
    }
    if (todays.length > MAX_MARKS) {
      const more = document.createElement('span');
      more.className = 'more';
      more.textContent = `+${todays.length - MAX_MARKS}`;
      marks.appendChild(more);
    }

    cell.append(num, marks);
    if (todays.length > 0) {
      // 마커는 모양과 색만 쓰므로, 스크린 리더용으로 그날 일정을 글로 적어 둔다.
      cell.setAttribute('aria-label',
        `${t.m}월 ${d}일 ${WEEKDAYS[weekdayOf(ds)]}요일, 일정 ${todays.length}건: ${todays.map(eventText).join(', ')}`);
      cell.setAttribute('aria-pressed', String(ds === selectedDate));
      if (ds === selectedDate) cell.classList.add('selected');
      // 같은 날짜를 다시 누르면 상세를 닫는다.
      cell.addEventListener('click', () => { selectedDate = ds === selectedDate ? null : ds; render(); });
    }
    cal.appendChild(cell);
  }

  renderDayDetail(today, byDate[selectedDate]);
}

// 선택한 날짜의 일정 상세. 선택이 없으면 숨긴다.
function renderDayDetail(today, dayEvents) {
  const box = $('dayDetail');
  box.replaceChildren();
  box.hidden = !selectedDate;
  if (!selectedDate) return;

  const { m, d } = parseYMD(selectedDate);
  box.setAttribute('aria-label', `${m}월 ${d}일 일정 상세`);

  const head = document.createElement('div');
  head.className = 'day-head';
  head.textContent = `${monthDay(selectedDate)} (${WEEKDAYS[weekdayOf(selectedDate)]}) · ` +
    `${ddayText(daysUntil(selectedDate, today))} · 일정 ${dayEvents.length}건`;
  box.appendChild(head);

  const ul = document.createElement('ul');
  let paySum = 0, hasPay = false;
  for (const e of dayEvents) {
    const li = document.createElement('li');

    const title = document.createElement('div');
    title.className = 'name';
    const mark = document.createElement('span');
    mark.className = e.kind === 'trial' ? 'trial-tag' : 'pay-tag';
    mark.textContent = e.kind === 'trial' ? '◆' : '●';
    title.append(mark, ` ${e.name}`);

    const meta = document.createElement('div');
    meta.className = 'meta';
    if (e.kind === 'trial') {
      meta.textContent = `체험 만료일 ${e.date}`;
    } else {
      meta.textContent = `${e.amount.toLocaleString('ko-KR')}원 · ${CYCLE_LABEL[e.cycle]} 결제`;
      paySum += e.amount;
      hasPay = true;
    }
    li.append(title, meta);
    ul.appendChild(li);
  }
  box.appendChild(ul);

  if (hasPay) {
    const sum = document.createElement('div');
    sum.className = 'day-sum';
    sum.textContent = `이날 결제 합계 ${paySum.toLocaleString('ko-KR')}원`;
    box.appendChild(sum);
  }
}

const AGENDA_VISIBLE = 3; // 남은 결제 일정은 기본으로 이 건수만 보여주고, 나머지는 펼쳐서 본다
let agendaExpanded = false;

function renderAgenda(today, events) {
  const ul = $('agenda');
  ul.replaceChildren();

  // 건수가 적으면 접을 필요가 없으므로 버튼을 숨기고 펼침 상태도 되돌린다.
  const collapsible = events.length > AGENDA_VISIBLE;
  if (!collapsible) agendaExpanded = false;
  const toggle = $('agendaToggle');
  toggle.hidden = !collapsible;
  toggle.setAttribute('aria-expanded', String(agendaExpanded));
  toggle.textContent = agendaExpanded ? '접기' : `나머지 ${events.length - AGENDA_VISIBLE}건 더 보기`;

  if (events.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '이번 달 남은 결제 일정이 없어요.';
    ul.appendChild(li);
    return;
  }
  const shown = agendaExpanded ? events : events.slice(0, AGENDA_VISIBLE);
  for (const e of shown) {
    const li = document.createElement('li');

    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = `${monthDay(e.date)} (${WEEKDAYS[weekdayOf(e.date)]})`;

    const dday = document.createElement('span');
    dday.className = 'dday';
    dday.textContent = ddayText(daysUntil(e.date, today));

    const what = document.createElement('span');
    what.className = 'what';
    if (e.kind === 'trial') {
      const mark = document.createElement('span');
      mark.className = 'trial-tag';
      mark.textContent = '◆';
      const label = document.createElement('span');
      label.className = 'trial-tag';
      label.textContent = '체험 만료';
      what.append(mark, ` ${e.name} · `, label);
    } else {
      const dot = document.createElement('span');
      dot.className = 'pay-tag';
      dot.textContent = '●';
      what.append(dot, ` ${e.name} · ${e.amount.toLocaleString('ko-KR')}원`);
    }

    li.append(date, dday, what);
    ul.appendChild(li);
  }
}

let listOpen = false; // 등록된 구독 목록을 펼쳐 보고 있는지 (저장하지 않는다)

function renderListToggle() {
  const btn = $('listToggle');
  btn.textContent = listOpen ? '구독 목록 닫기' : `구독 목록 보기 (${subs.length})`;
  btn.setAttribute('aria-expanded', String(listOpen));
  $('list').hidden = !listOpen;
}

function render() {
  const today = getToday();
  renderSummary(today);
  renderListToggle();
  const events = monthEvents(subs, today);
  renderCalendar(today, events);
  renderAgenda(today, events);

  const list = $('list');
  list.replaceChildren();

  if (subs.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 등록된 구독이 없어요.';
    list.appendChild(li);
    return;
  }

  for (const s of subs) {
    const li = document.createElement('li');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.name;

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = s.kind === 'trial' ? '무료 체험' : '정기 결제';

    const meta = document.createElement('div');
    meta.className = 'meta';
    // 체험은 만료일이 이번 달이 아니어도 D-day를 보여준다. (다음 달 만료도 놓치지 않게)
    const left = s.kind === 'trial' ? daysUntil(s.expiryDate, today) : 0;
    meta.textContent = s.kind === 'trial'
      ? `체험 만료일 ${s.expiryDate} · ${left < 0 ? `만료됨 (${ddayText(left)})` : ddayText(left)}`
      :`${s.amount.toLocaleString('ko-KR')}원 · ${CYCLE_LABEL[s.cycle]} · 결제 일자 ${s.baseDate}`;

    li.append(name, badge, meta);

    // 합계가 맞는지 확인할 수 있도록, 이번 달 남은 결제일을 항목마다 보여준다.
    if (s.kind === 'pay') {
      const dates = remainingPaymentDates(s, today);
      const due = document.createElement('div');
      due.className = 'meta';
      due.textContent = dates.length === 0
        ? '이번 달 남은 결제 없음'
        : `이번 달 남은 결제일 ${dates.map(monthDay).join(', ')}` +
          (dates.length > 1 ? ` (${dates.length}회)` : '');
      li.appendChild(due);
    }
    list.appendChild(li);
  }
}

// 종류에 맞는 입력란만 보여준다. 숨긴 입력란은 disabled로 두어 검증 대상에서 뺀다.
function syncKind() {
  const trial = $('kind').value === 'trial';
  $('payFields').hidden = trial;
  $('trialFields').hidden = !trial;
  for (const id of ['amount', 'cycle', 'baseDate']) $(id).disabled = trial;
  $('expiryDate').disabled = !trial;
}

// ---------- 등록 ----------
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 입력값을 검사해서 { sub } 또는 { error }를 돌려준다.
function readForm() {
  const name = $('name').value.trim();
  if (!name) return { error: '이름을 입력해 주세요.' };

  if ($('kind').value === 'trial') {
    const expiryDate = $('expiryDate').value;
    if (!DATE_RE.test(expiryDate)) return { error: '체험 만료일을 입력해 주세요.' };
    return { sub: { id: newId(), name, kind: 'trial', expiryDate } };
  }

  const amountText = $('amount').value.trim();
  const amount = Number(amountText);
  if (amountText === '' || !Number.isInteger(amount) || amount < 0) {
    return { error: '금액은 0 이상의 정수로 입력해 주세요.' };
  }
  const baseDate = $('baseDate').value;
  if (!DATE_RE.test(baseDate)) return { error: '결제 일자를 입력해 주세요.' };
  return { sub: { id: newId(), name, kind: 'pay', amount, cycle: $('cycle').value, baseDate } };
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const { sub, error } = readForm();
  $('error').textContent = error || '';
  // 목록이 접혀 있어도 등록됐는지 알 수 있게 확인 문구를 보여준다.
  $('status').textContent = error ? '' : `${sub.name} 등록 완료`;
  if (error) return;

  subs.push(sub);
  $('storageNotice').hidden = saveSubs(subs);
  render();

  // 이름과 날짜, 금액은 비우고 종류와 주기는 유지한다. (연속 등록하기 편하게)
  for (const id of ['name', 'amount', 'baseDate', 'expiryDate']) $(id).value = '';
  $('name').focus();
});

$('kind').addEventListener('change', () => { $('error').textContent = ''; syncKind(); });

// 금액은 직접 입력만 받는다. 숫자 칸의 증감 버튼/방향키/휠 대신 일반 입력칸을 쓰고, 숫자 외 글자는 지운다.
// (붙여넣은 "17,000"도 17000이 된다.)
$('amount').addEventListener('input', () => {
  const el = $('amount');
  const digits = el.value.replace(/\D/g, '');
  if (digits !== el.value) el.value = digits;
});

$('agendaToggle').addEventListener('click', () => { agendaExpanded = !agendaExpanded; render(); });
$('listToggle').addEventListener('click', () => { listOpen = !listOpen; renderListToggle(); });

// ---------- 시작 ----------
$('storageNotice').hidden = storageAvailable();
syncKind();
render();
</script>
</body>
</html>
