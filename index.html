<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-Cut</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #ffffff; --text: #181c2b; --muted: #70778c; --line: #e8eaf3;
    --pay: #4f6bff; --pay-soft: #eceffe; --trial: #ff7a2f; --trial-soft: #fff0e6;
    --danger: #e5384f; --danger-soft: #fdeaed; --warn: #d98a00; --warn-soft: #fff4dc;
    --ok: #20a366; --ok-soft: #e4f6ec;
    --track: #edeff7; --field: #f6f7fc;
    --shadow: 0 1px 2px rgba(24, 28, 43, .04), 0 8px 24px rgba(24, 28, 43, .06);
    --grad: linear-gradient(135deg, #4f6bff 0%, #8a5cff 100%);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e111a; --card: #171b28; --text: #eceffa; --muted: #8d95ad; --line: #252a3d;
      --pay: #7b91ff; --pay-soft: #222a4d; --trial: #ff9a5c; --trial-soft: #3a2619;
      --danger: #ff6b7e; --danger-soft: #3d1c24; --warn: #f2b84a; --warn-soft: #3a2f16;
      --ok: #4fcf91; --ok-soft: #173126;
      --track: #252a3d; --field: #1d2233;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --grad: linear-gradient(135deg, #6f86ff 0%, #a07bff 100%);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); min-height: 100vh;
    background: radial-gradient(900px 420px at 10% -10%, color-mix(in srgb, var(--pay) 14%, transparent), transparent 70%),
                radial-gradient(700px 380px at 100% 0%, color-mix(in srgb, var(--trial) 10%, transparent), transparent 70%),
                var(--bg);
    font: 15px/1.5 "Pretendard", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 56px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--grad); display: grid; place-items: center;
    color: #fff; font-size: 22px; box-shadow: 0 6px 16px color-mix(in srgb, var(--pay) 40%, transparent); }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; line-height: 1.1; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .today-chip { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
    box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .stat::after { content: ""; position: absolute; right: -18px; top: -18px; width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent, var(--pay)); opacity: .12; }
  .stat:nth-child(1) { --accent: var(--pay); }
  .stat:nth-child(2) { --accent: var(--warn); }
  .stat:nth-child(3) { --accent: var(--trial); }
  .stat small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .stat b { display: block; font-size: 26px; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .layout { display: grid; grid-template-columns: 1fr 350px; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .card h2:not(:first-child) { margin-top: 22px; }

  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; align-items: end;
    padding: 14px; background: var(--field); border-radius: 14px; }
  label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 500; }
  input, select, button { font: inherit; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); min-width: 0; transition: border-color .15s, box-shadow .15s, transform .1s, filter .15s; }
  input:hover, select:hover { border-color: color-mix(in srgb, var(--pay) 40%, var(--line)); }
  input:focus, select:focus { outline: none; border-color: var(--pay); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pay) 22%, transparent); }
  button { cursor: pointer; background: var(--grad); color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--pay) 35%, transparent); }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--pay); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; box-shadow: none; }
  button.ghost:hover { color: var(--text); border-color: var(--muted); filter: none; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { --tone: var(--pay); --tone-soft: var(--pay-soft); position: relative; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px 13px 18px; overflow: hidden;
    transition: transform .15s, box-shadow .15s; }
  .item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone); }
  .item:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .item.trial { --tone: var(--trial); --tone-soft: var(--trial-soft); }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .name { font-weight: 650; letter-spacing: -.01em; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; font-weight: 650;
    color: var(--tone); background: var(--tone-soft); }
  .badge.pay { --tone: var(--pay); --tone-soft: var(--pay-soft); }
  .badge.trial { --tone: var(--trial); --tone-soft: var(--trial-soft); }
  .dday { font-weight: 750; font-variant-numeric: tabular-nums; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .dday.danger { color: var(--danger); background: var(--danger-soft); }
  .dday.warn { color: var(--warn); background: var(--warn-soft); }
  .dday.ok { color: var(--ok); background: var(--ok-soft); }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .bar { height: 7px; border-radius: 999px; background: var(--track); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width .4s ease; }
  .bar i.warn { background: var(--warn); } .bar i.danger { background: var(--danger); }
  .del, .edit { padding: 2px 8px; font-size: 12px; margin-left: 6px; border-radius: 8px; }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .edit:hover { color: var(--pay); border-color: var(--pay); }
  .item.editing { border-color: var(--pay); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pay) 18%, transparent); }
  .toast { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; border: 1px dashed var(--line); border-radius: 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head b { font-size: 16px; letter-spacing: -.01em; }
  .cal-head button { padding: 3px 12px; background: var(--field); color: var(--text); border-color: transparent; box-shadow: none; font-size: 16px; }
  .cal-head button:hover { background: var(--pay-soft); filter: none; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .dow { font-size: 11px; color: var(--muted); padding-bottom: 4px; font-weight: 600; }
  .dow:first-child { color: var(--danger); } .dow:nth-child(7) { color: var(--pay); }
  .day { min-height: 46px; border-radius: 10px; padding: 5px 0 3px; font-size: 12.5px; background: var(--field);
    transition: background .12s; font-variant-numeric: tabular-nums; }
  .day[style*="pointer"]:hover { background: var(--pay-soft); }
  .day.out { opacity: .3; }
  .day.today { background: var(--grad); color: #fff; font-weight: 700; }
  .dots { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pay); }
  .day.today .dot { box-shadow: 0 0 0 1.5px #fff; }
  .dot.trial { background: var(--trial); border-radius: 2px; transform: rotate(45deg); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 14px; }
  .legend .dot { display: inline-block; vertical-align: middle; margin-right: 5px; }
  .day-list { margin-top: 12px; font-size: 13px; }
  .day-list:not(:empty) { padding: 12px 14px; background: var(--field); border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">✂</div>
      <div>
        <h1>Sub<span>-Cut</span></h1>
        <div class="sub">정기 결제일과 무료 체험 만료일을 한눈에</div>
      </div>
    </div>
    <div class="today-chip" id="todayChip"></div>
  </header>

  <section class="summary" id="summary"></section>

  <div class="layout">
    <div class="card">
      <h2>구독 추가</h2>
      <form id="form">
        <label>이름<input name="name" required placeholder="예: Netflix"></label>
        <label>종류
          <select name="kind">
            <option value="pay">정기 결제</option>
            <option value="trial">무료 체험</option>
          </select>
        </label>
        <label><span id="dateLabel">결제일</span><input name="date" type="date" required></label>
        <label id="cycleWrap">주기
          <select name="cycle">
            <option value="month">매월</option>
            <option value="year">매년</option>
            <option value="week">매주</option>
          </select>
        </label>
        <label>금액(원)<input name="amount" type="number" min="0" step="100" placeholder="0"></label>
        <button type="submit" id="submitBtn">추가</button>
        <button type="button" class="ghost" id="cancelEdit" hidden>취소</button>
      </form>

      <h2>다가오는 순서</h2>
      <ul id="list"></ul>
      <div class="tools">
        <button class="ghost" id="sample" type="button">예시 데이터 넣기</button>
        <button class="ghost" id="clear" type="button">전체 삭제</button>
        <button class="ghost" id="export" type="button">내보내기</button>
        <button class="ghost" id="import" type="button">가져오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>

    <div class="card">
      <div class="cal-head">
        <button id="prev" aria-label="이전 달">‹</button>
        <b id="monthTitle"></b>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div class="legend">
        <span><span class="dot"></span>정기 결제</span>
        <span><span class="dot trial"></span>체험 만료</span>
      </div>
      <div class="day-list" id="dayList"></div>
    </div>
  </div>
</div>

<script>
const KEY = 'sub-cut:v1';
const $ = (id) => document.getElementById(id);
const won = (n) => (n || 0).toLocaleString('ko-KR') + '원';
const DAY = 86400000;

let subs = load();
let view = startOfMonth(new Date());
let selected = null;
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(subs)); } catch {}
}

function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function diffDays(a, b) { return Math.round((a - b) / DAY); }

// base 날짜에서 n번째 주기 뒤 날짜 (말일 보정: 31일 → 30/28일)
function nth(base, cycle, n) {
  if (cycle === 'week') return new Date(base.getFullYear(), base.getMonth(), base.getDate() + 7 * n);
  const months = cycle === 'year' ? 12 * n : n;
  const t = new Date(base.getFullYear(), base.getMonth() + months, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return new Date(t.getFullYear(), t.getMonth(), Math.min(base.getDate(), last));
}

// 오늘 이후(오늘 포함) 첫 이벤트 날짜와 직전 날짜
function nextEvent(s) {
  const base = parse(s.date), t = today();
  if (s.kind === 'trial') return { next: base, prev: null };
  let n = 0, d = base;
  while (d < t) d = nth(base, s.cycle, ++n);
  return { next: d, prev: n > 0 ? nth(base, s.cycle, n - 1) : null };
}

function eventsInMonth(m) {
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const out = {};
  const add = (d, s) => (out[iso(d)] ||= []).push(s);
  for (const s of subs) {
    const base = parse(s.date);
    if (s.kind === 'trial') { if (base >= first && base <= last) add(base, s); continue; }
    for (let n = 0, d = base; d <= last; d = nth(base, s.cycle, ++n)) if (d >= first) add(d, s);
  }
  return out;
}

function level(days, kind) {
  if (days <= (kind === 'trial' ? 3 : 1)) return 'danger';
  if (days <= (kind === 'trial' ? 7 : 5)) return 'warn';
  return 'ok';
}
function ddayText(days) { return days === 0 ? 'D-DAY' : days > 0 ? `D-${days}` : `D+${-days}`; }
const CYCLE = { month: '매월', year: '매년', week: '매주' };

function render() {
  const t = today();
  const rows = subs.map((s) => ({ s, ...nextEvent(s) }))
    .map((r) => ({ ...r, days: diffDays(r.next, t) }))
    .sort((a, b) => a.days - b.days);

  // 요약
  const active = rows.filter((r) => r.s.kind === 'pay');
  const monthly = active.reduce((sum, r) => sum + (r.s.amount || 0) *
    (r.s.cycle === 'year' ? 1 / 12 : r.s.cycle === 'week' ? 52 / 12 : 1), 0);
  const in7 = rows.filter((r) => r.days >= 0 && r.days <= 7);
  const trials = rows.filter((r) => r.s.kind === 'trial' && r.days >= 0);
  $('summary').innerHTML = `
    <div class="stat"><small>월 예상 지출</small><b>${won(Math.round(monthly))}</b></div>
    <div class="stat"><small>7일 내 일정</small><b>${in7.length}건</b></div>
    <div class="stat"><small>진행 중인 체험</small><b>${trials.length}건</b></div>`;

  // 목록
  const list = $('list');
  list.innerHTML = '';
  if (!rows.length) list.innerHTML = '<li class="empty">아직 등록된 구독이 없어요.</li>';
  for (const r of rows) {
    const { s, days } = r;
    const expired = s.kind === 'trial' && days < 0;
    const lv = expired ? 'danger' : level(days, s.kind);
    let pct;
    if (s.kind === 'trial') pct = Math.max(0, Math.min(100, (1 - days / 30) * 100));
    else {
      const total = diffDays(r.next, r.prev || nth(parse(s.date), s.cycle, -1));
      pct = Math.max(0, Math.min(100, (1 - days / total) * 100));
    }
    const li = document.createElement('li');
    li.className = 'item ' + s.kind;
    li.innerHTML = `
      <div class="row">
        <div><span class="name"></span><span class="badge ${s.kind}">${s.kind === 'trial' ? '체험' : '결제'}</span></div>
        <div><span class="dday ${lv}">${expired ? '만료됨 ' : ''}${ddayText(days)}</span>
          <button class="ghost edit" aria-label="수정">수정</button><button class="ghost del" aria-label="삭제">✕</button></div>
      </div>
      <div class="meta">${iso(r.next)} · ${s.kind === 'trial' ? '체험 만료' : CYCLE[s.cycle] + ' 결제'}${s.amount ? ' · ' + won(s.amount) : ''}</div>
      <div class="bar"><i class="${lv === 'ok' ? '' : lv}" style="width:${pct}%"></i></div>`;
    li.querySelector('.name').textContent = s.name;
    if (s.id === editingId) li.classList.add('editing');
    li.querySelector('.edit').onclick = () => startEdit(s);
    li.querySelector('.del').onclick = () => {
      subs = subs.filter((x) => x.id !== s.id);
      if (editingId === s.id) stopEdit();
      save(); render();
    };
    list.appendChild(li);
  }

  renderCal();
}

function renderCal() {
  const ev = eventsInMonth(view);
  $('monthTitle').textContent = `${view.getFullYear()}년 ${view.getMonth() + 1}월`;
  const cal = $('cal');
  cal.innerHTML = ['일', '월', '화', '수', '목', '금', '토'].map((d) => `<div class="dow">${d}</div>`).join('');
  const start = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
  const tk = iso(today());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;
    const k = iso(d), list = d.getMonth() === view.getMonth() ? ev[k] || [] : [];
    const el = document.createElement('div');
    el.className = 'day' + (d.getMonth() !== view.getMonth() ? ' out' : '') + (k === tk ? ' today' : '');
    el.innerHTML = `${d.getDate()}<div class="dots">${list.map((s) => `<span class="dot ${s.kind === 'trial' ? 'trial' : ''}"></span>`).join('')}</div>`;
    if (list.length) { el.style.cursor = 'pointer'; el.onclick = () => { selected = k; renderDayList(ev); }; }
    cal.appendChild(el);
  }
  renderDayList(ev);
}

function renderDayList(ev) {
  const box = $('dayList');
  const list = selected && ev[selected];
  if (!list) { box.textContent = ''; return; }
  box.innerHTML = `<b>${selected}</b><br>`;
  for (const s of list) {
    const line = document.createElement('div');
    line.textContent = `${s.kind === 'trial' ? '◆ 체험 만료' : '● 결제'} · ${s.name}${s.amount ? ' · ' + won(s.amount) : ''}`;
    box.appendChild(line);
  }
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const data = {
    name: f.get('name').trim(), kind: f.get('kind'), date: f.get('date'),
    cycle: f.get('cycle'), amount: Number(f.get('amount')) || 0,
  };
  if (editingId) subs = subs.map((s) => (s.id === editingId ? { ...s, ...data } : s));
  else subs.push({ id: newId(), ...data });
  save(); stopEdit(); render();
});

function newId() { return Date.now() + Math.random().toString(16).slice(2); }

// 수정: 목록 항목을 폼에 불러와 같은 폼으로 저장
function startEdit(s) {
  editingId = s.id;
  const form = $('form');
  for (const k of ['name', 'kind', 'date', 'cycle', 'amount']) form.elements[k].value = s[k] ?? '';
  syncKind();
  $('submitBtn').textContent = '저장';
  $('cancelEdit').hidden = false;
  form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  form.elements.name.focus();
  render();
}
function stopEdit() {
  editingId = null;
  $('form').reset();
  $('submitBtn').textContent = '추가';
  $('cancelEdit').hidden = true;
  syncKind();
}
$('cancelEdit').onclick = () => { stopEdit(); render(); };

// 백업: JSON 내보내기 / 가져오기 (같은 id는 덮어쓰고 나머지는 합침)
$('export').onclick = () => {
  if (!subs.length) return note('내보낼 구독이 없어요.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(subs, null, 2)], { type: 'application/json' }));
  a.download = `sub-cut-${iso(today())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  note(`${subs.length}건을 내보냈어요.`);
};
$('import').onclick = () => $('importFile').click();
$('importFile').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const arr = JSON.parse(await file.text());
    const valid = (Array.isArray(arr) ? arr : []).filter((x) => x && typeof x.name === 'string' &&
      (x.kind === 'pay' || x.kind === 'trial') && /^\d{4}-\d{2}-\d{2}$/.test(x.date))
      .map((x) => ({ id: String(x.id || newId()), name: x.name, kind: x.kind, date: x.date,
        cycle: ['month', 'year', 'week'].includes(x.cycle) ? x.cycle : 'month', amount: Number(x.amount) || 0 }));
    if (!valid.length) return note('가져올 수 있는 구독이 없어요. 파일을 확인해 주세요.');
    const ids = new Set(valid.map((x) => x.id));
    subs = subs.filter((s) => !ids.has(s.id)).concat(valid);
    save(); render();
    note(`${valid.length}건을 가져왔어요.`);
  } catch { note('JSON 파일을 읽을 수 없어요.'); }
};
function note(msg) { $('toast').textContent = msg; }

function syncKind() {
  const trial = document.querySelector('[name=kind]').value === 'trial';
  $('cycleWrap').hidden = trial;
  $('dateLabel').textContent = trial ? '만료일' : '첫 결제일';
}
document.querySelector('[name=kind]').addEventListener('change', syncKind);

$('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); selected = null; renderCal(); };
$('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); selected = null; renderCal(); };

$('clear').onclick = () => { if (subs.length && confirm('모든 구독을 삭제할까요?')) { subs = []; save(); render(); } };
$('sample').onclick = () => {
  const t = today(), at = (n) => iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n));
  const mk = (name, kind, n, cycle, amount) => ({ id: newId(), name, kind, date: at(n), cycle, amount });
  subs.push(mk('Netflix', 'pay', 3, 'month', 17000), mk('YouTube Premium', 'pay', 10, 'month', 14900),
    mk('Notion', 'pay', 40, 'year', 120000), mk('Spotify 체험', 'trial', 2, 'month', 10900),
    mk('ChatGPT 체험', 'trial', 12, 'month', 29000));
  save(); render();
};

$('todayChip').textContent = today().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
syncKind();
render();
</script>
</body>
</html>
