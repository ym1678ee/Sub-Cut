<!doctype html>
<!-- show-intro: 접속할 때마다 시작 화면을 먼저 보여준다. 클래스를 HTML에 직접 두어 메인 화면이 잠깐 보였다 사라지지 않게 한다. -->
<html lang="ko" class="show-intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-Cut</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f2a; --muted: #667085; --line: #dfe3ea;
    --accent: #3b5bdb; --warn: #b54708; --warn-bg: #fff4e5; --err: #c0262d; --on-err: #ffffff; --trial: #c2410c; --sel: #e7ecff; --gone: #8a93a5;
    /* D-day 칩 색: 긴급(D-DAY·D-1)=빨강, 임박(D-2·D-3)=노랑, 여유(D-4 이상)=초록 */
    --dd-red-fg: #b4232a; --dd-red-bg: #fdeaea; --dd-red-bd: #d92d3a;
    --dd-yellow-fg: #7a5200; --dd-yellow-bg: #fff3bf; --dd-yellow-bd: #b98600;
    --dd-green-fg: #1d6b3d; --dd-green-bg: #e3f6ea; --dd-green-bd: #2f9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --card: #1a1f2b; --text: #e8ebf2; --muted: #98a2b3; --line: #2b3242;
      --accent: #7c93ff; --warn: #f5b04a; --warn-bg: #3a2f16; --err: #ff7b82; --on-err: #2a1114; --trial: #fb923c; --sel: #26304f; --gone: #8a95ab;
      --dd-red-fg: #ff9aa2; --dd-red-bg: #3d1c24; --dd-red-bd: #ff6b7e;
      --dd-yellow-fg: #ffd84d; --dd-yellow-bg: #3a3000; --dd-yellow-bd: #d4a900;
      --dd-green-fg: #7be0a3; --dd-green-bg: #14301f; --dd-green-bd: #3fb36f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; cursor: pointer; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fields { display: grid; gap: 12px; }
  .fields[hidden] { display: none; }
  .error { color: var(--err); font-size: 13px; min-height: 1.2em; margin: 0; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .name { font-weight: 600; }
  .badge { font-size: 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 0 8px; margin-left: 8px; }
  .meta { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .summary { text-align: center; }
  .summary .label { color: var(--muted); font-size: 13px; }
  .summary .total { font-size: 32px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .summary .range { color: var(--muted); font-size: 13px; }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
  .cal .cell { min-height: 48px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px;
    text-align: center; font-size: 13px; }
  .cal .blank { border: none; }
  .cal .past .num { color: var(--muted); } /* 지난 날짜는 숫자만 연하게. (칸 전체를 흐리게 하면 회색 마커가 안 보인다) */
  .cal .today { outline: 2px solid var(--accent); outline-offset: -1px; font-weight: 700; }
  .marks { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1px; font-size: 12px; line-height: 1.2; min-height: 1.2em; }
  .marks .pay { color: var(--accent); }
  .marks .trial { color: var(--trial); }
  .marks .more { color: var(--muted); font-size: 11px; }
  .marks .gone, .legend .gone, .day-detail .gone { color: var(--gone); } /* 오늘 이전의 지난 일정: 회색 */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
  .legend .pay { color: var(--accent); }
  .legend .trial { color: var(--trial); }
  /* 달력 제목은 가운데, 이동 버튼은 양옆 */
  .cal-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; text-align: center; }
  button.calnav { padding: 4px 0; font-size: 20px; line-height: 1; background: var(--field, var(--bg)); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  button.calnav:disabled { opacity: .35; cursor: default; }
  .cal-today { text-align: center; margin: -4px 0 8px; }
  .cal-today[hidden] { display: none; }
  /* 범례는 왼쪽 아래, 월별 총 구독료는 오른쪽 아래 */
  .cal-foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; margin-top: 10px; }
  .month-total { margin-left: auto; text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .agenda li { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: baseline; }
  /* 일정이 없을 때의 안내 문구는 3칸 격자 대신 일반 블록으로 두어 가운데 정렬한다. */
  .agenda li.empty { display: block; text-align: center; }
  .agenda .date { font-weight: 600; font-variant-numeric: tabular-nums; }
  .agenda .dday { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .agenda .dday.urgent { color: var(--dd-red-fg); background: var(--dd-red-bg); border-color: var(--dd-red-bd); font-weight: 700; }
  .agenda .dday.soon { color: var(--dd-yellow-fg); background: var(--dd-yellow-bg); border-color: var(--dd-yellow-bd); font-weight: 600; }
  .agenda .dday.calm { color: var(--dd-green-fg); background: var(--dd-green-bg); border-color: var(--dd-green-bd); }
  .agenda .what { min-width: 0; overflow-wrap: anywhere; }
  .agenda .trial-tag { color: var(--trial); font-weight: 600; }
  .agenda .pay-tag { color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; min-height: 1.2em; margin: 8px 0 0; }
  ul[hidden] { display: none; }
  #list { margin-top: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 8px; }
  .actions .ask { margin-right: auto; font-size: 13px; color: var(--err); font-weight: 600; }
  .actions .ask.ask-end { color: var(--text); } /* 해지 확인 문구는 삭제 확인처럼 경고색이 아니다 */
  button.small { padding: 4px 12px; font-size: 13px; font-weight: 600; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.ghost.del { color: var(--err); }
  button.danger { background: var(--err); color: var(--on-err); }
  #cancelEdit[hidden] { display: none; }
  #list li.editing { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cal .num { display: block; }
  button.cell { font: inherit; font-weight: normal; color: inherit; background: transparent; width: 100%; cursor: pointer; }
  button.cell:hover { border-color: var(--accent); }
  .cal .cell.selected { background: var(--sel); border-color: var(--accent); }
  .day-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-detail[hidden] { display: none; }
  .day-detail .day-head { font-weight: 600; margin-bottom: 8px; }
  .day-detail ul { gap: 6px; }
  .day-detail .pay-tag { color: var(--accent); }
  .day-detail .trial-tag { color: var(--trial); }
  .day-detail .day-sum { margin-top: 8px; font-size: 13px; font-weight: 600; text-align: right; }
  button.toggle { width: 100%; margin-top: 10px; background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button.toggle[hidden] { display: none; }

  /* 시작 화면: 접속할 때마다 화면 전체를 덮는 버튼. 어디를 눌러도 메인 화면으로 넘어간다. */
  #start { display: none; }
  .show-intro #start { display: grid; }
  .show-intro #main { display: none; }
  button.start { width: 100%; min-height: 100vh; min-height: 100dvh; place-content: center; justify-items: center; gap: 14px;
    padding: 24px 16px; border: 0; border-radius: 0; background: var(--bg); color: var(--text); font-weight: 400; cursor: pointer; }
  button.start:focus-visible { outline-offset: -6px; }
  /* 자간(letter-spacing)은 마지막 글자 뒤에도 붙으므로, 같은 크기의 왼쪽 여백으로 가운데 정렬을 맞춘다. */
  .start-title { font-size: clamp(40px, 13vw, 76px); font-weight: 800; letter-spacing: .14em; padding-left: .14em; line-height: 1.1; color: var(--accent); }
  .start-desc { font-size: 16px; line-height: 1.6; color: var(--muted); }
  .start-desc span { display: block; }
  .start-hint { margin-top: 28px; font-size: 15px; color: var(--text); animation: start-blink 2.2s ease-in-out infinite; }
  @keyframes start-blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .start-hint { animation: none; } }
  #mainTitle:focus, #manageTitle:focus, #listTitle:focus, #calTitle:focus { outline: none; }

  /* 화면 이동 링크: 메인의 "구독 목록 확인하기", 구독 관리 화면의 "←Home" */
  a.navbtn { display: block; margin-bottom: 16px; padding: 12px; text-align: center; text-decoration: none; font-weight: 600;
    color: var(--accent); background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  a.navlink { display: inline-block; padding: 6px 12px; text-decoration: none; font-weight: 600; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  a.navbtn:focus-visible, a.navlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  a.navbtn:hover, a.navlink:hover { border-color: var(--accent); }
  .topbar { margin-bottom: 12px; }
  .hint { margin: -8px 0 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .hint[hidden] { display: none; }
  #listTitle { margin-top: 20px; }
</style>
</head>
<body>
<button type="button" id="start" class="start">
  <span class="start-title">SUB-CUT</span>
  <span class="start-desc">
    <span>Subscribe Cut</span>
    <span>구독 결제일과 무료 체험 만료일을 한눈에,</span>
    <span>필요없는 구독을 확인하세요!</span>
  </span>
  <span class="start-hint">화면을 클릭하세요</span>
</button>

<div class="wrap" id="main">
  <div class="notice" id="storageNotice" hidden>
    이 브라우저에서는 저장소를 사용할 수 없어요. 입력한 내용은 새로고침하면 사라져요.
  </div>

  <!-- 메인 화면 -->
  <div id="homeView">
  <h1 id="mainTitle" tabindex="-1">Sub-Cut</h1>

  <section class="card summary" id="summary" aria-live="polite">
    <div class="label">이번 달 남은 구독료</div>
    <div class="total" id="total"></div>
    <div class="range" id="range"></div>
  </section>

  <a href="#manage" class="navbtn" id="goManage"></a>
  <p class="hint" id="emptyHint" hidden>구독 목록 확인하기를 눌러 구독을 등록하세요.</p>

  <section class="card">
    <div class="cal-head">
      <button type="button" class="calnav" id="calPrev" aria-label="이전 달">‹</button>
      <h2 id="calTitle" tabindex="-1" aria-live="polite"></h2>
      <button type="button" class="calnav" id="calNext" aria-label="다음 달">›</button>
    </div>
    <div class="cal-today"><button type="button" class="small ghost" id="calToday" hidden>이번 달로</button></div>
    <div class="cal" id="cal"></div>
    <div class="cal-foot">
      <div class="legend" aria-hidden="true">
        <span><span class="pay">●</span> 결제일</span>
        <span><span class="trial">◆</span> 체험 만료일</span>
        <span><span class="gone">●</span> 지난 일정</span>
      </div>
      <div class="month-total" id="monthTotal"></div>
    </div>
    <div class="day-detail" id="dayDetail" role="region" aria-live="polite" hidden></div>
  </section>

  <section class="card">
    <h2>남은 결제 일정</h2>
    <ul class="agenda" id="agenda"></ul>
    <button type="button" class="toggle" id="agendaToggle" aria-controls="agenda" aria-expanded="false" hidden></button>
  </section>
  </div>

  <!-- 구독 관리 화면 -->
  <div id="manageView" hidden>
  <div class="topbar"><a href="#home" class="navlink" id="goHome">←Home</a></div>
  <h1 id="manageTitle" tabindex="-1">구독 관리</h1>

  <section class="card">
    <h2>구독 등록</h2>
    <form id="form" novalidate>
      <label>이름
        <input id="name" required maxlength="50" placeholder="예: Netflix" autocomplete="off">
      </label>
      <label>종류
        <select id="kind">
          <option value="pay">정기 결제</option>
          <option value="trial">무료 체험</option>
        </select>
      </label>

      <div class="fields" id="payFields">
        <label>금액 (원)
          <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="예: 17000">
        </label>
        <label>결제 주기
          <select id="cycle">
            <option value="month">매월</option>
            <option value="year">매년</option>
            <option value="week">매주</option>
          </select>
        </label>
        <label>결제 일자
          <input id="baseDate" type="date">
        </label>
      </div>

      <div class="fields" id="trialFields" hidden>
        <label>체험 만료일
          <input id="expiryDate" type="date" disabled>
        </label>
      </div>

      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submitBtn">등록</button>
      <button type="button" class="ghost" id="cancelEdit" hidden>수정 취소</button>
    </form>
    <p class="status" id="status" role="status"></p>

    <h2 id="listTitle" tabindex="-1"></h2>
    <ul id="list"></ul>
  </section>
  </div>
</div>

<script>
const STORAGE_KEY = 'sub-cut:v2';
const CYCLE_LABEL = { month: '매월', year: '매년', week: '매주' };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

const $ = (id) => document.getElementById(id);

// ---------- 저장소 ----------
// 구독 목록은 항상 배열이다. 저장소가 막혀 있거나 비어 있어도 빈 배열로 시작한다.
function isValidSub(s) {
  if (!s || typeof s.id !== 'string' || typeof s.name !== 'string') return false;
  // endDate(해지일)는 없어도 되는 항목이다. 없으면 해지하지 않은 구독이다. (이전에 저장한 데이터도 그대로 읽힌다)
  if (s.endDate !== undefined && !DATE_RE.test(s.endDate)) return false;
  if (s.kind === 'trial') return DATE_RE.test(s.expiryDate);
  if (s.kind === 'pay') {
    return Number.isInteger(s.amount) && s.amount >= 0 &&
      s.cycle in CYCLE_LABEL && DATE_RE.test(s.baseDate);
  }
  return false;
}

function loadSubs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(isValidSub) : [];
  } catch {
    return [];
  }
}

// 저장에 성공하면 true, 실패하면 false
function saveSubs(list) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch {
    return false;
  }
}

function storageAvailable() {
  try {
    const k = STORAGE_KEY + ':probe';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch {
    return false;
  }
}

let subs = loadSubs();

// ---------- 날짜 계산 ----------
// 날짜는 'YYYY-MM-DD' 문자열로 다룬다. 같은 형식이라 문자열 비교가 곧 날짜 비교다.
// 일 수 계산에만 UTC 기준 숫자를 쓰고(시간대 영향 없음), 로컬 시간대로 바꾸지 않는다.
const pad = (n) => String(n).padStart(2, '0');
const fmt = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const DAY_MS = 86400000;

function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return { y, m, d };
}
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function toDayNumber(s) { const { y, m, d } = parseYMD(s); return Date.UTC(y, m - 1, d) / DAY_MS; }
function fromDayNumber(n) {
  const t = new Date(n * DAY_MS);
  return fmt(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
}

// 오늘(기기의 로컬 날짜). 테스트에서 바꿔 끼울 수 있게 함수로 분리했다.
function getToday() {
  const t = new Date();
  return fmt(t.getFullYear(), t.getMonth() + 1, t.getDate());
}

// y년 m월 한 달 동안의 이 구독의 결제일 목록(지난 날짜 포함)을 돌려준다.
// 체험은 결제하지 않으므로 항상 빈 배열이다. 기준일 이전에는 결제가 없다.
// 해지한 구독(endDate 있음)은 해지일 "전"의 결제만 인정한다. 해지일 당일과 그 이후는 결제하지 않은 것으로 본다.
function paymentDatesInMonth(sub, y, m) {
  return scheduledPaymentDates(sub, y, m).filter((ds) => !sub.endDate || ds < sub.endDate);
}

// 해지를 고려하지 않고, 결제 일자와 주기만으로 계산한 결제일 목록
function scheduledPaymentDates(sub, y, m) {
  if (sub.kind !== 'pay') return [];
  const base = parseYMD(sub.baseDate);

  // 그 달의 결제일. 기준일의 '일'이 그 달에 없으면 말일로 당긴다.
  const clamped = () => fmt(y, m, Math.min(base.d, daysInMonth(y, m)));

  if (sub.cycle === 'month') {
    const ds = clamped();
    return ds >= sub.baseDate ? [ds] : [];
  }
  if (sub.cycle === 'year') {
    if (base.m !== m) return [];
    const ds = clamped();
    return ds >= sub.baseDate ? [ds] : [];
  }
  // 매주: 기준일에서 7일씩 더한 날짜 중 그 달 안에 드는 날짜
  const baseNum = toDayNumber(sub.baseDate);
  const startNum = Math.max(toDayNumber(fmt(y, m, 1)), baseNum);
  const endNum = toDayNumber(fmt(y, m, daysInMonth(y, m)));
  const dates = [];
  for (let n = baseNum + Math.ceil((startNum - baseNum) / 7) * 7; n <= endNum; n += 7) {
    dates.push(fromDayNumber(n));
  }
  return dates;
}

// 오늘(포함)부터 이번 달 말일(포함)까지, 이 구독의 결제일 목록을 돌려준다.
function remainingPaymentDates(sub, today) {
  const t = parseYMD(today);
  return paymentDatesInMonth(sub, t.y, t.m).filter((ds) => ds >= today);
}

// y년 m월 한 달 동안 나가는(나간) 구독료 총합과 결제 건수. 지난 결제도 포함한다.
function monthTotalFor(list, y, m) {
  let total = 0, count = 0;
  for (const s of list) {
    if (s.kind !== 'pay') continue;
    const n = paymentDatesInMonth(s, y, m).length;
    total += s.amount * n;
    count += n;
  }
  return { total, count };
}

// 이번 달 남은 구독료 총합과 결제 건수
function remainingTotal(list, today) {
  let total = 0, count = 0;
  for (const s of list) {
    if (s.kind !== 'pay') continue; // 체험은 금액이 없고 합계에도 넣지 않는다
    const n = remainingPaymentDates(s, today).length;
    total += s.amount * n;
    count += n;
  }
  return { total, count };
}

const monthDay = (ds) => { const { m, d } = parseYMD(ds); return `${m}/${d}`; };

const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function weekdayOf(ds) {
  const { y, m, d } = parseYMD(ds);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
const daysUntil = (ds, today) => toDayNumber(ds) - toDayNumber(today);
const ddayText = (diff) => (diff === 0 ? 'D-DAY' : diff > 0 ? `D-${diff}` : `D+${-diff}`);
// D-day 긴급도: D-DAY와 D-1은 urgent(빨강), D-2와 D-3은 soon(노랑), 그 밖은 calm(초록).
// 남은 일정만 다루므로 diff는 0 이상이다. 색은 보조 수단이고 D-day 글자는 항상 함께 표시한다.
const urgency = (diff) => (diff <= 1 ? 'urgent' : diff <= 3 ? 'soon' : 'calm');

// 오늘(포함)부터 이번 달 말일까지의 일정(결제일, 체험 만료일)을 날짜순으로 돌려준다.
// 결제일은 총합과 같은 remainingPaymentDates로 구하므로 둘이 어긋나지 않는다.
function monthEvents(list, today) {
  const t = parseYMD(today);
  const monthEnd = fmt(t.y, t.m, daysInMonth(t.y, t.m));
  const events = [];
  for (const s of list) {
    if (s.kind === 'trial') {
      if (s.expiryDate >= today && s.expiryDate <= monthEnd && (!s.endDate || s.expiryDate < s.endDate)) {
        events.push({ date: s.expiryDate, kind: 'trial', name: s.name });
      }
    } else {
      for (const date of remainingPaymentDates(s, today)) {
        events.push({ date, kind: 'pay', name: s.name, amount: s.amount, cycle: s.cycle });
      }
    }
  }
  // 날짜순. 같은 날에는 체험 만료를 먼저 보여준다. (놓치면 의도치 않은 결제가 생긴다)
  const rank = (e) => (e.kind === 'trial' ? 0 : 1);
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : rank(a) - rank(b)));
  return events;
}

// y년 m월 한 달 전체의 일정(결제일, 체험 만료일)을 날짜순으로 돌려준다. 지난 일정도 포함한다.
function calendarEvents(list, y, m) {
  const first = fmt(y, m, 1), last = fmt(y, m, daysInMonth(y, m));
  const events = [];
  for (const s of list) {
    if (s.kind === 'trial') {
      // 체험을 해지했다면 해지일 이후의 만료 알림은 지운다. (해지일 전에 이미 지난 만료일은 남는다)
      if (s.expiryDate >= first && s.expiryDate <= last && (!s.endDate || s.expiryDate < s.endDate)) {
        events.push({ date: s.expiryDate, kind: 'trial', name: s.name });
      }
    } else {
      for (const date of paymentDatesInMonth(s, y, m)) {
        events.push({ date, kind: 'pay', name: s.name, amount: s.amount, cycle: s.cycle });
      }
    }
  }
  const rank = (e) => (e.kind === 'trial' ? 0 : 1);
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : rank(a) - rank(b)));
  return events;
}

// past: 오늘 이전의 지난 일정이면 글로도 "지난 일정"임을 알린다. (달력의 회색 마커는 색에만 의존하지 않게)
const eventText = (e, past = false) => (e.kind === 'trial'
  ? `${e.name} 체험 만료`
  : `${e.name} 결제 ${e.amount.toLocaleString('ko-KR')}원`) + (past ? ' (지난 일정)' : '');

// ---------- 화면 ----------
function renderSummary(today) {
  const t = parseYMD(today);
  const { total, count } = remainingTotal(subs, today);
  $('total').textContent = `${total.toLocaleString('ko-KR')}원`;
  $('range').textContent =
    `${monthDay(today)} ~ ${t.m}/${daysInMonth(t.y, t.m)} · 결제 ${count}건`;
}

const MAX_MARKS = 3; // 한 칸에 마커를 이 개수까지 그리고 나머지는 +N으로 줄인다
let selectedDate = null; // 캘린더에서 눌러 상세를 보고 있는 날짜 ('YYYY-MM-DD')

// 달력이 보여주는 달은 "이번 달에서 몇 달 떨어졌는지"(calOffset)로만 기억한다. 저장하지 않는다.
// 이렇게 하면 오늘 날짜가 바뀌어도 보는 달이 이번 달 기준으로 따라가고, 시작 화면을 지나면 이번 달로 돌아온다.
const MIN_YEAR = 2000, MAX_YEAR = 2099; // 이동 범위: 2000년 1월 ~ 2099년 12월
let calOffset = 0;
const ymIndex = (y, m) => y * 12 + (m - 1);
const fromYmIndex = (i) => ({ y: Math.floor(i / 12), m: (i % 12) + 1 });
const MIN_INDEX = ymIndex(MIN_YEAR, 1), MAX_INDEX = ymIndex(MAX_YEAR, 12);
const clampIndex = (i) => Math.min(MAX_INDEX, Math.max(MIN_INDEX, i));

function viewIndex(today) {
  const t = parseYMD(today);
  return clampIndex(ymIndex(t.y, t.m) + calOffset);
}

// 달력을 delta개월 옮긴다. 범위 끝에서는 더 가지 않는다. 월이 바뀌면 열려 있던 날짜 상세는 닫는다.
function moveCalendar(delta) {
  const today = getToday(), t = parseYMD(today);
  calOffset = clampIndex(viewIndex(today) + delta) - ymIndex(t.y, t.m);
  selectedDate = null;
  render();
}

function renderCalendar(today) {
  const t = parseYMD(today);
  const idx = viewIndex(today), v = fromYmIndex(idx); // v: 지금 달력에 보이는 달
  $('calTitle').textContent = `${v.y}년 ${v.m}월`;
  $('calPrev').disabled = idx <= MIN_INDEX;
  $('calNext').disabled = idx >= MAX_INDEX;
  $('calToday').hidden = idx === ymIndex(t.y, t.m); // 다른 달을 볼 때만 "이번 달로" 버튼을 보인다

  // 월별 총 구독료는 그 달 전체(오늘 이전에 이미 나간 결제 포함)다. 맨 위 요약 카드의 "남은 구독료"와는 다르다.
  $('monthTotal').textContent = `${v.m}월 총 구독료 ${monthTotalFor(subs, v.y, v.m).total.toLocaleString('ko-KR')}원`;

  const events = calendarEvents(subs, v.y, v.m);
  const byDate = {};
  for (const e of events) (byDate[e.date] ||= []).push(e);
  // 선택한 날짜에 일정이 없어졌으면(구독 변경 등) 선택을 푼다.
  if (selectedDate && !byDate[selectedDate]) selectedDate = null;

  const cal = $('cal');
  cal.replaceChildren();
  for (const w of WEEKDAYS) {
    const h = document.createElement('div');
    h.className = 'dow';
    h.textContent = w;
    cal.appendChild(h);
  }

  // 1일이 시작하는 요일만큼 빈 칸을 둔다. (일요일 시작)
  const lead = weekdayOf(fmt(v.y, v.m, 1));
  for (let i = 0; i < lead; i++) {
    const b = document.createElement('div');
    b.className = 'cell blank';
    b.setAttribute('aria-hidden', 'true');
    cal.appendChild(b);
  }

  for (let d = 1; d <= daysInMonth(v.y, v.m); d++) {
    const ds = fmt(v.y, v.m, d);
    const todays = byDate[ds] || [];
    // 일정이 있는 날만 누를 수 있게 button으로 만든다.
    const cell = document.createElement(todays.length > 0 ? 'button' : 'div');
    cell.className = 'cell';
    if (todays.length > 0) cell.type = 'button';
    if (ds < today) cell.classList.add('past');
    if (ds === today) { cell.classList.add('today'); cell.setAttribute('aria-current', 'date'); }

    // button 안에는 div를 넣을 수 없어서 span을 쓴다. (줄바꿈은 CSS의 display로 처리)
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;

    const marks = document.createElement('span');
    marks.className = 'marks';
    marks.setAttribute('aria-hidden', 'true');
    for (const e of todays.slice(0, MAX_MARKS)) {
      const m = document.createElement('span');
      m.className = e.kind + (ds < today ? ' gone' : ''); // 오늘 이전의 지난 일정은 회색 마커
      m.textContent = e.kind === 'trial' ? '◆' : '●';
      marks.appendChild(m);
    }
    if (todays.length > MAX_MARKS) {
      const more = document.createElement('span');
      more.className = 'more';
      more.textContent = `+${todays.length - MAX_MARKS}`;
      marks.appendChild(more);
    }

    cell.append(num, marks);
    if (todays.length > 0) {
      // 마커는 모양과 색만 쓰므로, 스크린 리더용으로 그날 일정을 글로 적어 둔다.
      cell.setAttribute('aria-label',
        `${v.m}월 ${d}일 ${WEEKDAYS[weekdayOf(ds)]}요일, 일정 ${todays.length}건: ${todays.map((e) => eventText(e, ds < today)).join(', ')}`);
      cell.setAttribute('aria-pressed', String(ds === selectedDate));
      if (ds === selectedDate) cell.classList.add('selected');
      // 같은 날짜를 다시 누르면 상세를 닫는다.
      cell.addEventListener('click', () => { selectedDate = ds === selectedDate ? null : ds; render(); });
    }
    cal.appendChild(cell);
  }

  renderDayDetail(today, byDate[selectedDate]);
}

// 선택한 날짜의 일정 상세. 선택이 없으면 숨긴다.
function renderDayDetail(today, dayEvents) {
  const box = $('dayDetail');
  box.replaceChildren();
  box.hidden = !selectedDate;
  if (!selectedDate) return;

  const { m, d } = parseYMD(selectedDate);
  box.setAttribute('aria-label', `${m}월 ${d}일 일정 상세`);

  const head = document.createElement('div');
  head.className = 'day-head';
  head.textContent = `${monthDay(selectedDate)} (${WEEKDAYS[weekdayOf(selectedDate)]}) · ` +
    `${ddayText(daysUntil(selectedDate, today))} · 일정 ${dayEvents.length}건`;
  box.appendChild(head);

  const ul = document.createElement('ul');
  let paySum = 0, hasPay = false;
  for (const e of dayEvents) {
    const li = document.createElement('li');

    const title = document.createElement('div');
    title.className = 'name';
    const past = e.date < today; // 오늘 이전의 지난 일정은 달력 마커처럼 회색으로 표시한다
    const mark = document.createElement('span');
    mark.className = (e.kind === 'trial' ? 'trial-tag' : 'pay-tag') + (past ? ' gone' : '');
    mark.textContent = e.kind === 'trial' ? '◆' : '●';
    title.append(mark, ` ${e.name}`);

    const meta = document.createElement('div');
    meta.className = 'meta';
    if (e.kind === 'trial') {
      meta.textContent = `체험 만료일 ${e.date}`;
    } else {
      meta.textContent = `${e.amount.toLocaleString('ko-KR')}원 · ${CYCLE_LABEL[e.cycle]} 결제`;
      paySum += e.amount;
      hasPay = true;
    }
    if (past) meta.textContent += ' · 지난 일정';
    li.append(title, meta);
    ul.appendChild(li);
  }
  box.appendChild(ul);

  if (hasPay) {
    const sum = document.createElement('div');
    sum.className = 'day-sum';
    sum.textContent = `이날 결제 합계 ${paySum.toLocaleString('ko-KR')}원`;
    box.appendChild(sum);
  }
}

const AGENDA_VISIBLE = 3; // 남은 결제 일정은 기본으로 이 건수만 보여주고, 나머지는 펼쳐서 본다
let agendaExpanded = false;

function renderAgenda(today, events) {
  const ul = $('agenda');
  ul.replaceChildren();

  // 건수가 적으면 접을 필요가 없으므로 버튼을 숨기고 펼침 상태도 되돌린다.
  const collapsible = events.length > AGENDA_VISIBLE;
  if (!collapsible) agendaExpanded = false;
  const toggle = $('agendaToggle');
  toggle.hidden = !collapsible;
  toggle.setAttribute('aria-expanded', String(agendaExpanded));
  toggle.textContent = agendaExpanded ? '접기' : `나머지 ${events.length - AGENDA_VISIBLE}건 더 보기`;

  if (events.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '이번 달 남은 결제 일정이 없어요.';
    ul.appendChild(li);
    return;
  }
  const shown = agendaExpanded ? events : events.slice(0, AGENDA_VISIBLE);
  for (const e of shown) {
    const li = document.createElement('li');

    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = `${monthDay(e.date)} (${WEEKDAYS[weekdayOf(e.date)]})`;

    const dday = document.createElement('span');
    const diff = daysUntil(e.date, today);
    dday.className = `dday ${urgency(diff)}`;
    dday.textContent = ddayText(diff);

    const what = document.createElement('span');
    what.className = 'what';
    if (e.kind === 'trial') {
      const mark = document.createElement('span');
      mark.className = 'trial-tag';
      mark.textContent = '◆';
      const label = document.createElement('span');
      label.className = 'trial-tag';
      label.textContent = '체험 만료';
      what.append(mark, ` ${e.name} · `, label);
    } else {
      const dot = document.createElement('span');
      dot.className = 'pay-tag';
      dot.textContent = '●';
      what.append(dot, ` ${e.name} · ${e.amount.toLocaleString('ko-KR')}원`);
    }

    li.append(date, dday, what);
    ul.appendChild(li);
  }
}

// 구독 개수에 따라 바뀌는 문구: 메인의 이동 링크, 빈 상태 안내, 구독 관리 화면의 목록 제목
// 목록에 보이는 구독 = 해지하지 않은 구독. 해지한 구독은 목록에서 빠지지만, 이전 결제 기록은 달력과 총액에 남는다.
const activeSubs = () => subs.filter((s) => !s.endDate);

function renderNav() {
  const n = activeSubs().length;
  $('goManage').textContent = `구독 목록 확인하기 (${n})`;
  $('emptyHint').hidden = n > 0;
  $('listTitle').textContent = `등록된 구독 (${n})`;
}

// ---------- 삭제 ----------
let confirmingDeleteId = null; // 지금 "정말 삭제할까요?"를 묻고 있는 구독의 id
let confirmingEndId = null;    // 지금 "해당 서비스를 해지하셨나요?"를 묻고 있는 구독의 id

function makeButton(text, className, label, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = className;
  b.textContent = text;
  b.setAttribute('aria-label', label);
  b.addEventListener('click', onClick);
  return b;
}

const findItem = (id) => [...$('list').querySelectorAll('li')].find((li) => li.dataset.id === id);

function askDelete(s) {
  confirmingDeleteId = s.id;
  confirmingEndId = null; // 확인은 한 번에 하나만 묻는다
  render();
  findItem(s.id)?.querySelector('.confirm-no')?.focus(); // 실수로 바로 지우지 않도록 취소에 포커스를 둔다
}

function cancelDelete(s) {
  confirmingDeleteId = null;
  render();
  findItem(s.id)?.querySelector('.del')?.focus();
}

function deleteSub(s) {
  subs = subs.filter((x) => x.id !== s.id);
  confirmingDeleteId = null;
  if (editingId === s.id) stopEdit(); // 수정 중이던 항목을 지우면 수정 모드도 끝낸다
  $('storageNotice').hidden = saveSubs(subs);
  $('error').textContent = '';
  $('status').textContent = `${s.name} 삭제 완료`;
  render();
  $('listTitle').focus(); // 지운 항목은 사라졌으므로 포커스를 목록 제목으로 옮긴다
}

// ---------- 해지 ----------
// 해지: 오늘을 해지일(endDate)로 기록한다. 구독은 목록에서 사라지지만, 오늘 이전의 결제 기록은 달력과 월별 총액에 남는다.
// (삭제는 구독과 기록을 모두 지운다.)
function askEnd(s) {
  confirmingEndId = s.id;
  confirmingDeleteId = null;
  render();
  findItem(s.id)?.querySelector('.confirm-no')?.focus(); // 실수로 바로 해지하지 않도록 "해지 취소"에 포커스를 둔다
}

function abortEnd(s) {
  confirmingEndId = null;
  render();
  findItem(s.id)?.querySelector('.end')?.focus();
}

function endSub(s) {
  subs = subs.map((x) => (x.id === s.id ? { ...x, endDate: getToday() } : x));
  confirmingEndId = null;
  if (editingId === s.id) stopEdit(); // 수정 중이던 항목을 해지하면 수정 모드도 끝낸다
  $('storageNotice').hidden = saveSubs(subs);
  $('error').textContent = '';
  $('status').textContent = `${s.name} 해지 완료`;
  render();
  $('listTitle').focus(); // 해지한 항목은 목록에서 사라졌으므로 포커스를 목록 제목으로 옮긴다
}

function buildActions(s) {
  const box = document.createElement('div');
  box.className = 'actions';
  if (s.id === confirmingEndId) {
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', `${s.name} 해지 확인`);
    const ask = document.createElement('span');
    ask.className = 'ask ask-end';
    ask.textContent = '해당 서비스를 해지하셨나요?';
    box.append(
      ask,
      makeButton('해지 취소', 'small ghost confirm-no', `${s.name} 해지 취소`, () => abortEnd(s)),
      makeButton('해지', 'small confirm-yes end-yes', `${s.name} 해지 확정`, () => endSub(s)),
    );
  } else if (s.id === confirmingDeleteId) {
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', `${s.name} 삭제 확인`);
    const ask = document.createElement('span');
    ask.className = 'ask';
    ask.textContent = '정말 삭제할까요?';
    box.append(
      ask,
      makeButton('취소', 'small ghost confirm-no', `${s.name} 삭제 취소`, () => cancelDelete(s)),
      makeButton('삭제', 'small danger confirm-yes', `${s.name} 삭제 확정`, () => deleteSub(s)),
    );
  } else {
    box.append(
      makeButton('수정', 'small ghost edit', `${s.name} 수정`, () => startEdit(s)),
      makeButton('해지', 'small ghost end', `${s.name} 해지`, () => askEnd(s)),
      makeButton('삭제', 'small ghost del', `${s.name} 삭제`, () => askDelete(s)),
    );
  }
  return box;
}

function render() {
  const today = getToday();
  renderSummary(today);
  renderNav();
  const events = monthEvents(subs, today);
  renderCalendar(today);
  renderAgenda(today, events);

  const list = $('list');
  list.replaceChildren();
  // 목록에는 해지하지 않은 구독만 보인다. 확인을 묻던 구독이 목록에서 없어졌으면 확인 상태를 푼다.
  const shown = activeSubs();
  if (confirmingDeleteId && !shown.some((s) => s.id === confirmingDeleteId)) confirmingDeleteId = null;
  if (confirmingEndId && !shown.some((s) => s.id === confirmingEndId)) confirmingEndId = null;

  if (shown.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 등록된 구독이 없어요.';
    list.appendChild(li);
    return;
  }

  for (const s of shown) {
    const li = document.createElement('li');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.name;

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = s.kind === 'trial' ? '무료 체험' : '정기 결제';

    const meta = document.createElement('div');
    meta.className = 'meta';
    // 체험은 만료일이 이번 달이 아니어도 D-day를 보여준다. (다음 달 만료도 놓치지 않게)
    const left = s.kind === 'trial' ? daysUntil(s.expiryDate, today) : 0;
    meta.textContent = s.kind === 'trial'
      ? `체험 만료일 ${s.expiryDate} · ${left < 0 ? `만료됨 (${ddayText(left)})` : ddayText(left)}`
      :`${s.amount.toLocaleString('ko-KR')}원 · ${CYCLE_LABEL[s.cycle]} · 결제 일자 ${s.baseDate}`;

    li.append(name, badge, meta);

    // 합계가 맞는지 확인할 수 있도록, 이번 달 남은 결제일을 항목마다 보여준다.
    if (s.kind === 'pay') {
      const dates = remainingPaymentDates(s, today);
      const due = document.createElement('div');
      due.className = 'meta';
      due.textContent = dates.length === 0
        ? '이번 달 남은 결제 없음'
        : `이번 달 남은 결제일 ${dates.map(monthDay).join(', ')}` +
          (dates.length > 1 ? ` (${dates.length}회)` : '');
      li.appendChild(due);
    }

    li.dataset.id = s.id;
    if (s.id === editingId) li.classList.add('editing');
    li.appendChild(buildActions(s));
    // 삭제/해지 확인 중에 Esc를 누르면 취소한다.
    li.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (confirmingDeleteId === s.id) cancelDelete(s);
      else if (confirmingEndId === s.id) abortEnd(s);
    });
    list.appendChild(li);
  }
}

// 종류에 맞는 입력란만 보여준다. 숨긴 입력란은 disabled로 두어 검증 대상에서 뺀다.
function syncKind() {
  const trial = $('kind').value === 'trial';
  $('payFields').hidden = trial;
  $('trialFields').hidden = !trial;
  for (const id of ['amount', 'cycle', 'baseDate']) $(id).disabled = trial;
  $('expiryDate').disabled = !trial;
}

// ---------- 등록 ----------
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 입력값을 검사해서 { sub } 또는 { error }를 돌려준다.
function readForm() {
  const name = $('name').value.trim();
  if (!name) return { error: '이름을 입력해 주세요.' };

  if ($('kind').value === 'trial') {
    const expiryDate = $('expiryDate').value;
    if (!DATE_RE.test(expiryDate)) return { error: '체험 만료일을 입력해 주세요.' };
    return { sub: { name, kind: 'trial', expiryDate } };
  }

  const amountText = $('amount').value.trim();
  const amount = Number(amountText);
  if (amountText === '' || !Number.isInteger(amount) || amount < 0) {
    return { error: '금액은 0 이상의 정수로 입력해 주세요.' };
  }
  const baseDate = $('baseDate').value;
  if (!DATE_RE.test(baseDate)) return { error: '결제 일자를 입력해 주세요.' };
  return { sub: { name, kind: 'pay', amount, cycle: $('cycle').value, baseDate } };
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const { sub, error } = readForm(); // id는 들어 있지 않다. 새로 등록할 때만 붙인다.
  $('error').textContent = error || '';
  if (error) {
    // 수정 중이었다면 수정 모드를 유지한 채 오류만 보여준다.
    $('status').textContent = editingId ? `${$('name').value.trim() || '구독'} 수정 중` : '';
    return;
  }

  if (editingId) {
    // 같은 id와 같은 위치에서 값만 바꾼다.
    subs = subs.map((s) => (s.id === editingId ? { ...sub, id: s.id } : s));
    $('status').textContent = `${sub.name} 수정 완료`;
    stopEdit();
  } else {
    subs.push({ id: newId(), ...sub });
    // 목록이 접혀 있어도 등록됐는지 알 수 있게 확인 문구를 보여준다.
    $('status').textContent = `${sub.name} 등록 완료`;
    // 이름과 날짜, 금액은 비우고 종류와 주기는 유지한다. (연속 등록하기 편하게)
    for (const id of ['name', 'amount', 'baseDate', 'expiryDate']) $(id).value = '';
  }
  $('storageNotice').hidden = saveSubs(subs);
  render();
  $('name').focus();
});

// ---------- 수정 ----------
let editingId = null; // 지금 폼에서 수정 중인 구독의 id (null이면 새로 등록)

// 목록 항목의 값을 폼에 채워서 수정한다. 결제/체험은 입력 항목이 달라 종류는 바꾸지 못하게 잠근다.
function startEdit(s) {
  editingId = s.id;
  confirmingDeleteId = null;
  confirmingEndId = null;
  $('name').value = s.name;
  $('kind').value = s.kind;
  $('kind').disabled = true;
  syncKind();
  if (s.kind === 'pay') {
    $('amount').value = String(s.amount);
    $('cycle').value = s.cycle;
    $('baseDate').value = s.baseDate;
  } else {
    $('expiryDate').value = s.expiryDate;
  }
  $('submitBtn').textContent = '저장';
  $('cancelEdit').hidden = false;
  $('error').textContent = '';
  $('status').textContent = `${s.name} 수정 중`;
  render();
  $('form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('name').focus();
}

// 수정 모드를 끝내고 폼을 등록 상태로 되돌린다. (다시 그리는 것은 호출한 쪽이 한다)
function stopEdit() {
  editingId = null;
  $('kind').disabled = false;
  for (const id of ['name', 'amount', 'baseDate', 'expiryDate']) $(id).value = '';
  $('submitBtn').textContent = '등록';
  $('cancelEdit').hidden = true;
  syncKind();
}

$('cancelEdit').addEventListener('click', () => {
  stopEdit();
  $('error').textContent = '';
  $('status').textContent = '';
  render();
  $('name').focus();
});

$('kind').addEventListener('change', () => { $('error').textContent = ''; syncKind(); });

// 금액은 직접 입력만 받는다. 숫자 칸의 증감 버튼/방향키/휠 대신 일반 입력칸을 쓰고, 숫자 외 글자는 지운다.
// (붙여넣은 "17,000"도 17000이 된다.)
$('amount').addEventListener('input', () => {
  const el = $('amount');
  const digits = el.value.replace(/\D/g, '');
  if (digits !== el.value) el.value = digits;
});

// ---------- 달력 월 이동 ----------
$('calPrev').addEventListener('click', () => moveCalendar(-1));
$('calNext').addEventListener('click', () => moveCalendar(1));
$('calToday').addEventListener('click', () => {
  calOffset = 0;
  selectedDate = null;
  render();
  $('calTitle').focus(); // 눌러서 사라지는 버튼 대신 달력 제목으로 포커스를 옮긴다
});

$('agendaToggle').addEventListener('click', () => { agendaExpanded = !agendaExpanded; render(); });
// ---------- 화면 전환 ----------
// 같은 문서 안에서 주소의 해시로 화면을 바꾼다. #manage는 구독 관리 화면, 그 밖의 모든 주소는 메인 화면이다.
// 해시를 쓰면 브라우저의 뒤로 가기/앞으로 가기가 그대로 동작하고, 주소로 바로 열 수도 있다.
const currentRoute = () => (location.hash === '#manage' ? 'manage' : 'home');
const routeTitle = () => $(currentRoute() === 'manage' ? 'manageTitle' : 'mainTitle');

function applyRoute() {
  const manage = currentRoute() === 'manage';
  $('homeView').hidden = manage;
  $('manageView').hidden = !manage;
  document.title = manage ? '구독 관리 - Sub-Cut' : 'Sub-Cut';
}

window.addEventListener('hashchange', () => {
  // 구독 관리 화면을 떠나면 진행 중이던 수정/삭제 확인은 접고, 돌아왔을 때 처음 상태로 보이게 한다.
  if (currentRoute() === 'home') {
    if (editingId) stopEdit();
    confirmingDeleteId = null;
    confirmingEndId = null;
    $('error').textContent = '';
    $('status').textContent = '';
  }
  applyRoute();
  render();
  window.scrollTo(0, 0);
  routeTitle().focus(); // 키보드 사용자가 새 화면 제목부터 이어서 움직일 수 있게 한다
});

// ---------- 시작 화면 ----------
// 시작 화면은 접속할 때마다(새로고침 포함) 보이고, 누르면 주소에 맞는 화면으로 넘어간다.
// 화면 전환(#manage 등)은 문서를 다시 불러오지 않으므로, 앱 안에서 이동할 때는 다시 나타나지 않는다.
// 아무것도 저장하지 않는다. (이전 버전이 남긴 'sub-cut:intro-seen' 기록이 있어도 무시한다)
$('start').addEventListener('click', () => {
  document.documentElement.classList.remove('show-intro');
  window.scrollTo(0, 0);
  routeTitle().focus(); // 키보드 사용자가 화면에서 이어서 움직일 수 있게 제목으로 포커스를 옮긴다
});

// ---------- 시작 ----------
$('storageNotice').hidden = storageAvailable();
syncKind();
applyRoute();
render();
</script>
</body>
</html>
